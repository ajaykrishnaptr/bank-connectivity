{% extends "base.html" %}
{% block content %}
<div style="max-width:420px;margin:3rem auto;">
  <div class="card">
    <div class="page-header">
      <h2>Sign in</h2>
      <p>Access your Bank Connectivity dashboard.</p>
    </div>
    <form method="POST" action="{{ url_for('login') }}" style="display:flex;flex-direction:column;gap:1rem;margin-top:1.25rem;">
      <div>
        <label style="font-size:.8125rem;font-weight:500;color:var(--text-2);display:block;margin-bottom:.35rem;">Email</label>
        <input type="email" name="email" required autocomplete="email"
          style="width:100%;padding:.55rem .75rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.875rem;font-family:inherit;outline:none;transition:border-color .15s;"
          onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
      </div>
      <div>
        <label style="font-size:.8125rem;font-weight:500;color:var(--text-2);display:block;margin-bottom:.35rem;">Password</label>
        <input type="password" name="password" required autocomplete="current-password"
          style="width:100%;padding:.55rem .75rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.875rem;font-family:inherit;outline:none;transition:border-color .15s;"
          onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:.25rem;">Sign in</button>
    </form>
    <p style="text-align:center;margin-top:1.25rem;font-size:.8125rem;color:var(--text-3);">
      No account? <a href="{{ url_for('signup') }}">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
